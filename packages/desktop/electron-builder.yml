appId: com.lotagent.desktop
productName: Lot Agent
copyright: Copyright © 2026

directories:
  output: release

# electron-updater is an external production dependency; electron-builder
# includes its production dependency tree inside the asar.
artifactName: linquclaw-${version}-${os}-${arch}.${ext}
files:
  - dist/**
  - package.json

extraResources:
  - from: scripts/mac-update-helper.sh
    to: updater/mac-update-helper.sh
  # The built web app, served by the main process's loopback server.
  - from: ../web/dist
    to: web-dist
  - from: build/tray-icon.png
    to: icons/tray-icon.png

asar: true
npmRebuild: false

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: "录制个人声音样例，用于数字分身视频创作。 / Record voice samples for your digital twin videos."
    NSCameraUsageDescription: "拍摄个人肖像，用于数字分身视频创作。 / Take portraits for your digital twin videos."
  # Unsigned by default so anyone can build. To sign + notarize, remove the
  # line below and provide CSC_LINK / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID — see docs/desktop.md.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Lot Agent
  # Generate app-update.yml/cache metadata. Runtime uses the signed custom
  # provider and the build-pinned URL, never this placeholder feed.
publish:
  provider: generic
  url: https://updates.invalid/
