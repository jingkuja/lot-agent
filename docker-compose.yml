# ─────────────────────────────────────────────────────────────
# Lot Agent — single-host deployment (first version).
#
# Services:
#   postgres  business data (named volume pg_data)
#   redis     BullMQ queue / gen-cache / progress pub-sub (requirepass)
#   server    Hono HTTP API            (Node image, ROLE=server)
#   worker    BullMQ job consumer       (same Node image, ROLE=worker)
#   web       nginx: serves web/dist + reverse-proxies /api and /static
#
# server & worker share the SAME built image (lot-agent-app) and the SAME
# `app_data` volume — the worker writes generated assets, the server serves
# them at /static, so they MUST see the same files.
#
# Secrets come from `.env` (copy from deploy/.env.example). Nothing secret is
# hard-coded here. Local development without Docker uses the root .env.example.
# ─────────────────────────────────────────────────────────────

# Shared app environment for server & worker (YAML anchor, merged per service).
# Every variable here is read by the app; defaults match the code. Template: deploy/.env.example.
x-app-env: &app-env
  NODE_ENV: production
  # Production must never enable the local-development login bypass.
  DEBUG: "0"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  globle: ${globle:-0}
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: ${PG_USER:-postgres}
  PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
  PG_DATABASE: ${PG_DATABASE:-lot}
  # Worker PG pool (4–200); must be at least 2 × MARKETING_VIDEO_CONCURRENCY + 2.
  PG_POOL_MAX: ${PG_POOL_MAX:-20}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
  # Text models
  LLM_DEFAULT: ${LLM_DEFAULT:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://tokenhub.wetok.ai/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4.1-flash}
  OPENAI_PROTOCOL: ${OPENAI_PROTOCOL:-chat-completions}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
  BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
  DEBUG_LLM: ${DEBUG_LLM:-}
  # Hosts web_fetch may reach on private addresses (comma-separated); empty keeps them blocked.
  WEB_FETCH_ALLOW_HOSTS: ${WEB_FETCH_ALLOW_HOSTS:-}
  # Gateway (New API / TokenHub). Image/video generation needs a key on both server
  # and worker; IMAGE_GEN_API_KEY / VIDEO_GEN_API_KEY override TOKENHUB_API_KEY per media.
  TOKENHUB_BASE_URL: ${TOKENHUB_BASE_URL:-https://tokenhub.wetok.ai/api/agent-market}
  TOKENHUB_API_KEY: ${TOKENHUB_API_KEY:-}
  IMAGE_GEN_API_KEY: ${IMAGE_GEN_API_KEY:-}
  VIDEO_GEN_API_KEY: ${VIDEO_GEN_API_KEY:-}
  # Shared secret proving this Agent (box) to new-api on URL token auto-login.
  # Sent as `Authorization: Bearer` when exchanging ?token via /auth/token-login;
  # if unset or mismatched, new-api replies 403 "invalid agent key". Keep secret.
  NEW_API_AGENT_KEY: ${NEW_API_AGENT_KEY:-}
  NEW_API_MANAGED_KEYS: ${NEW_API_MANAGED_KEYS:-1}
  NEW_API_INTERNAL_BASE_URL: ${NEW_API_INTERNAL_BASE_URL:-https://tokenhub.wetok.ai/api/internal}
  NEW_API_INTERNAL_CLIENT_ID: ${NEW_API_INTERNAL_CLIENT_ID:-lot-agent}
  NEW_API_INTERNAL_CLIENT_SECRET: ${NEW_API_INTERNAL_CLIENT_SECRET:-}
  # Public addresses
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
  # Absolute base for static file URLs (assets/documents/uploads). Leave empty
  # for same-origin access; set to the box address so generated download links
  # are reachable externally, e.g. http://192.168.1.50:3000
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  LOT_AGENT_PUBLIC_URL: ${LOT_AGENT_PUBLIC_URL:-}
  TOKENHUB_PUBLIC_URL: ${TOKENHUB_PUBLIC_URL:-https://tokenhub.todoucloud.com}
  # Model configuration page linked from the digital employee; empty uses https://wetok.ai/.
  TOKENHUB_WEB_URL: ${TOKENHUB_WEB_URL:-}
  # Knowledge base
  RAG_API_URL: ${RAG_API_URL:-https://ai-rag.gafz.com.cn}
  RAG_INTEGRATION_KEY: ${RAG_INTEGRATION_KEY:-}
  KNOWLEDGE_MANAGEMENT_ENABLED: ${KNOWLEDGE_MANAGEMENT_ENABLED:-0}
  KNOWLEDGE_EXTERNAL_ENABLED: ${KNOWLEDGE_EXTERNAL_ENABLED:-0}
  KNOWLEDGE_PG_POOL_MAX: ${KNOWLEDGE_PG_POOL_MAX:-4}
  KNOWLEDGE_INGESTION_ENABLED: ${KNOWLEDGE_INGESTION_ENABLED:-0}
  KNOWLEDGE_QUEUE: ${KNOWLEDGE_QUEUE:-lot-knowledge}
  KNOWLEDGE_CONCURRENCY: ${KNOWLEDGE_CONCURRENCY:-2}
  # WeChat mini program and virtual payment (Agent server only)
  WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
  WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
  WECHAT_VIRTUAL_PAY_ENABLED: ${WECHAT_VIRTUAL_PAY_ENABLED:-0}
  WECHAT_VIRTUAL_PAY_ENV: ${WECHAT_VIRTUAL_PAY_ENV:-0}
  WECHAT_VIRTUAL_PAY_OFFER_ID: ${WECHAT_VIRTUAL_PAY_OFFER_ID:-}
  WECHAT_VIRTUAL_PAY_APP_KEY: ${WECHAT_VIRTUAL_PAY_APP_KEY:-}
  WECHAT_VIRTUAL_PAY_SANDBOX_APP_KEY: ${WECHAT_VIRTUAL_PAY_SANDBOX_APP_KEY:-}
  WECHAT_VIRTUAL_PAY_GOODS: ${WECHAT_VIRTUAL_PAY_GOODS:-}
  # Voice services (dedicated keys, no fallback to other credentials)
  KLING_VOICE_BASE_URL: ${KLING_VOICE_BASE_URL:-https://tokenhub.tencentmaas.com/v1}
  KLING_VOICE_API_KEY: ${KLING_VOICE_API_KEY:-}
  QWEN_VOICE_BASE_URL: ${QWEN_VOICE_BASE_URL:-https://maas.qianwenaiapi.com/api/v1}
  QWEN_VOICE_API_KEY: ${QWEN_VOICE_API_KEY:-}
  QWEN_VOICE_TARGET_MODEL: ${QWEN_VOICE_TARGET_MODEL:-qwen-audio-3.0-tts-plus}
  # PPT thumbnails
  PPT_PREVIEW: ${PPT_PREVIEW:-1}
  PPT_SOFFICE_PATH: ${PPT_SOFFICE_PATH:-soffice}
  PPT_PDFTOPPM_PATH: ${PPT_PDFTOPPM_PATH:-pdftoppm}
  # Marketing video
  MARKETING_VIDEO_MODEL: ${MARKETING_VIDEO_MODEL:-grok-imagine-video-1.5}
  MARKETING_KEY_ART_MODEL: ${MARKETING_KEY_ART_MODEL:-gpt-image-2.5-flare}
  MARKETING_VIDEO_CONCURRENCY: ${MARKETING_VIDEO_CONCURRENCY:-2}
  MARKETING_VIDEO_USER_CONCURRENCY: ${MARKETING_VIDEO_USER_CONCURRENCY:-1}
  MARKETING_VIDEO_SEGMENT_CONCURRENCY: ${MARKETING_VIDEO_SEGMENT_CONCURRENCY:-4}
  MARKETING_FFMPEG_PATH: ${MARKETING_FFMPEG_PATH:-ffmpeg}
  MARKETING_FFPROBE_PATH: ${MARKETING_FFPROBE_PATH:-ffprobe}
  MARKETING_SUBTITLE_FONT: ${MARKETING_SUBTITLE_FONT:-Noto Sans CJK SC}
  # Operations API key (>= 32 characters); empty leaves /api/admin unmounted.
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  # Reference video analysis (media-analysis worker profile). YTDLP_SHA256 is a build
  # argument of Dockerfile.media-analysis only; the runtime checks YTDLP_VERSION.
  MARKETING_ANALYSIS_ENABLED: ${MARKETING_ANALYSIS_ENABLED:-0}
  MARKETING_ANALYSIS_CONCURRENCY: ${MARKETING_ANALYSIS_CONCURRENCY:-2}
  MARKETING_ANALYSIS_OCR_CONCURRENCY: ${MARKETING_ANALYSIS_OCR_CONCURRENCY:-8}
  MARKETING_ANALYSIS_VISUAL_CONCURRENCY: ${MARKETING_ANALYSIS_VISUAL_CONCURRENCY:-3}
  MARKETING_ANALYSIS_DECODE_THREADS: ${MARKETING_ANALYSIS_DECODE_THREADS:-4}
  MARKETING_ANALYSIS_OWNER_BYTES: ${MARKETING_ANALYSIS_OWNER_BYTES:-2147483648}
  MARKETING_ANALYSIS_MIN_FREE_BYTES: ${MARKETING_ANALYSIS_MIN_FREE_BYTES:-1073741824}
  YTDLP_VERSION: ${YTDLP_VERSION:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      POSTGRES_DB: ${PG_DATABASE:-lot}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs only on first init of an empty data volume.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-lot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  server:
    # Image built separately from `Dockerfile` (see docs/deployment.md):
    #   docker build -t lot-agent-app:1.0 -f Dockerfile .
    image: lot-agent-app:1.0
    restart: unless-stopped
    environment:
      <<: *app-env
      FEISHU_ENABLED: ${FEISHU_ENABLED:-1}
      FEISHU_LONG_CONNECTION: ${FEISHU_LONG_CONNECTION:-1}
      ROLE: server
      PORT: "3000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Uncomment to reach the API directly (bypassing nginx) for debugging:
    # ports:
    #   - "3000:3000"

  worker:
    # Same image as `server` (one build, two roles via ROLE).
    image: lot-agent-app:1.0
    restart: unless-stopped
    environment:
      <<: *app-env
      ROLE: worker
    # The shared image's HEALTHCHECK probes :3000/health, which only the server
    # serves. The worker has no HTTP port, so disable it to avoid a false
    # "unhealthy" status (the process staying up is the liveness signal here).
    healthcheck:
      disable: true
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-worker:
    image: lot-agent-app:1.0
    profiles: [knowledge]
    restart: unless-stopped
    environment:
      <<: *app-env
      ROLE: knowledge-worker
    healthcheck:
      disable: true
    volumes:
      - app_data:/app/data
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-analysis-worker:
    image: lot-agent-media-analysis:1.0
    profiles: [media-analysis]
    restart: unless-stopped
    environment:
      <<: *app-env
      ROLE: media-analysis-worker
    healthcheck:
      disable: true
    mem_limit: 3g
    cpus: 2
    # Chromium and its proxy threads need headroom for the default two jobs.
    pids_limit: 512
    # The host must permit unprivileged user namespaces for bubblewrap.
    # No privileged mode, host networking or Docker socket is permitted.
    # Ubuntu/Docker defaults may also block clone and mount. Install and verify
    # the dedicated profiles in deploy/security/README.md before enabling them.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - app_data:/app/data
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # Image built separately from `Dockerfile.web` (see docs/deployment.md):
    #   docker build -t lot-agent-web:1.0 -f Dockerfile.web .
    image: lot-agent-web:1.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pg_data:
  redis_data:
  app_data:
