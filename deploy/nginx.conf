# ─────────────────────────────────────────────────────────────
# nginx for the Lot Agent web container.
#  - Serves the React SPA from /usr/share/nginx/html (history fallback).
#  - Reverse-proxies the API and static assets to the `server` container,
#    so the browser talks to a single same-origin endpoint (no CORS).
#  - SSE-friendly: buffering off + long read timeout for the chat stream.
# The upstream host `server` is the docker-compose service name.
# ─────────────────────────────────────────────────────────────

upstream lot_server {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    # Reasonable cap for user uploads (attachments, incl. large videos).
    client_max_body_size 155m;

    # gzip text assets (not the proxied SSE stream).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Release staging is private even when kept under the website root.
    location = /lot-agent-release { return 404; }
    location ^~ /lot-agent-release/ { return 404; }

    # Desktop updates: persistent read-only mount, never SPA fallback.
    # Mount host update root at /www/wwwroot/todoucloud.com/updates; terminate TLS upstream.
    location ^~ /updates/ {
        root /www/wwwroot/todoucloud.com;
        autoindex off;
        gzip off;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Hide publication staging and locks; private keys belong outside this root.
        location ~ /\. { deny all; }
        location ~ /latest\.json$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ /download\.(dmg|exe)$ {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
    }

    # Preserve existing website download links. These symlinks are advanced
    # only after the corresponding channel is published successfully.
    location = /linquclaw-arm64.dmg {
        alias /www/wwwroot/todoucloud.com/updates/stable/mac-arm64/download.dmg;
        add_header Cache-Control "no-store" always;
    }
    location = /linquclaw.dmg {
        alias /www/wwwroot/todoucloud.com/updates/stable/mac-x64/download.dmg;
        add_header Cache-Control "no-store" always;
    }
    location = /linquclaw.exe {
        alias /www/wwwroot/todoucloud.com/updates/stable/win-x64/download.exe;
        add_header Cache-Control "no-store" always;
    }

    # Container-local health endpoint for HEALTHCHECK (not proxied).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Retired OAuth links may still contain codes/state: keep their URLs out of logs.
    location ^~ /api/public/feishu/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Private previews carry short-lived capabilities: do not log their URLs.
    location /api/rag/preview/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Model audio downloads carry expiring capabilities; never log the token.
    location ^~ /api/public/marketing-analysis-audio/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # Knowledge video cap is 200 MiB; the app enforces smaller limits by MIME.
    location = /api/rag/manage/uploads {
        client_max_body_size 200m;
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Replacing a private video has the same cap as the initial upload.
    location ~ ^/api/rag/manage/items/[^/]+/file$ {
        client_max_body_size 200m;
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend API (includes the SSE chat stream under /api/.../messages).
    location /api/ {
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events: never buffer, keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Generated/served media: assets, documents, uploads.
    location /static/ {
        proxy_pass http://lot_server;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Hashed Vite bundles can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 机器信息服务(容器内 agender:8080),公开可达。
    location = /system/stats {
        proxy_pass http://127.0.0.1:8080/system/stats;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA history fallback — everything else returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
