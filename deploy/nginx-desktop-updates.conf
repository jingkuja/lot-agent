# Include inside the HTTPS server block for todoucloud.com.
    # Release staging is private even when kept under the website root.
    location = /lot-agent-release { return 404; }
    location ^~ /lot-agent-release/ { return 404; }

    location ^~ /updates/ {
        root /www/wwwroot/todoucloud.com;
        autoindex off;
        gzip off;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Hide publication staging and locks; private keys belong outside this root.
        location ~ /\. { deny all; }
        location ~ /latest\.json$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ /download\.(dmg|exe)$ {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
    }

